<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURELIA — Pricing Intelligence for Tour Operators</title>
    <meta name="description" content="Know your real profit. AURELIA calculates exact profit across every OTA, channel and group size — in real time." />
    <meta name="author" content="AURELIA" />

    <meta property="og:title" content="AURELIA — Pricing Intelligence for Tour Operators" />
    <meta property="og:description" content="Stop guessing. Calculate exact profit across every OTA, channel and group size — in real time." />
    <meta property="og:type" content="website" />

    <!-- PWA: theme-color + Android/Chrome install (manifest link is auto-injected by vite-plugin-pwa) -->
    <meta name="theme-color" content="#0a0a0f" />

    <!-- PWA: iOS "Add to Home Screen" support — iOS ignores the web manifest for most of this -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AURELIA" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Google Fonts (Inter + Fraunces) — preconnect + <link rel="stylesheet"> so the browser
         fetches these in parallel with everything else, instead of the render-blocking chain a
         CSS @import causes (index.css -> fonts.googleapis.com -> fonts.gstatic.com). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400..900&display=swap" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
